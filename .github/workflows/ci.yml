name: VelaRi CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd go)"
      - name: Check packaging scripts
        shell: bash
        run: sh -n scripts/install.sh scripts/build-all.sh scripts/package-linux.sh
      - run: go test ./...
      - run: go build -trimpath -o bin/velari ./cmd/velari

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: GOOS=js GOARCH=wasm go build -trimpath -o velari.wasm ./cmd/velari
      - uses: actions/upload-artifact@v4
        with:
          name: velari-wasm
          path: velari.wasm
