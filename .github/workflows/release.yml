name: VelaRi Release Assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            format: nsis
            artifact_path: target/release/packager/nsis/*.exe
          - os: ubuntu-latest
            format: deb,appimage
            artifact_path: target/release/packager/deb/*.deb,target/release/packager/appimage/*.AppImage
          - os: macos-latest
            format: dmg
            artifact_path: target/release/packager/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Linux requires specific packaging tools depending on the format
      - name: Install Linux Packaging Tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg build-essential

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # cargo-packager natively compiles and builds the installer bundle
      - name: Build Installer Package
        run: cargo packager --release --formats ${{ matrix.format }}

      # Automatically uploads the generated installer to your GitHub Release
      - name: Upload Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
