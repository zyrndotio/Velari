name: VelaRi Release Assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  portable:
    name: Portable ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: velari-linux-x86_64.tar.gz
            binary: target/x86_64-unknown-linux-gnu/release/velari
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: velari-windows-x86_64.zip
            binary: target/x86_64-pc-windows-msvc/release/velari.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --all-targets
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "${{ matrix.binary }}" staging/velari
          cp README.md LICENSE NOTICE staging/
          tar -czf "${{ matrix.archive }}" -C staging .
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "${{ matrix.binary }}" staging/velari.exe
          cp README.md LICENSE NOTICE staging/
          7z a "${{ matrix.archive }}" ./staging/*
      - name: Create checksum
        shell: bash
        run: sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - name: Upload portable assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "VelaRi $GITHUB_REF_NAME" --prerelease --notes "VelaRi beta release. Please report regressions before the stable release."
          else
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "VelaRi $GITHUB_REF_NAME" --notes "VelaRi release assets."
          fi
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.archive }}" "${{ matrix.archive }}.sha256" --clobber

  installers:
    name: Installer ${{ matrix.name }}
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows NSIS
            os: windows-latest
            format: nsis
            pattern: target/release/Velari*.exe
          - name: Linux Debian
            os: ubuntu-latest
            format: deb
            pattern: target/release/*.deb
          - name: Linux AppImage
            os: ubuntu-latest
            format: appimage
            pattern: target/release/*.AppImage
          - name: macOS DMG
            os: macos-latest
            format: dmg
            pattern: target/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fuse3 libfuse2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Build installer
        shell: bash
        run: cargo packager --release --formats "${{ matrix.format }}"
      - name: Normalize Windows installer name
        if: runner.os == 'Windows'
        shell: bash
        run: |
          installer=$(find target/release -maxdepth 1 -type f -iname '*-setup.exe' | head -1)
          test -n "$installer"
          cp "$installer" Velari-Setup.exe
      - name: Stage installer files
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          find target/release -maxdepth 1 -type f -path "${{ matrix.pattern }}" -exec cp {} staging/ \;
      - name: Create installer checksums
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            sha256sum Velari-Setup.exe > Velari-Setup.exe.sha256
          else
            sha256sum staging/* > installer-checksums.sha256
          fi
      - name: Upload installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            gh release upload "$GITHUB_REF_NAME" Velari-Setup.exe Velari-Setup.exe.sha256 --clobber
          else
            gh release upload "$GITHUB_REF_NAME" staging/* installer-checksums.sha256 --clobber
          fi
