name: VelaRi Release Assets

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: tar.gz
          - goos: windows
            goarch: amd64
            suffix: zip
          - goos: darwin
            goarch: arm64
            suffix: tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test
        run: go test ./...
      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          mkdir -p staging
          binary="velari-${GOOS}-${GOARCH}"
          if [[ "$GOOS" == windows ]]; then binary="$binary.exe"; fi
          GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w" -o "staging/$binary" ./cmd/velari
          cp README.md LICENSE NOTICE staging/
          archive="velari-${GOOS}-${GOARCH}.${{ matrix.suffix }}"
          if [[ "${{ matrix.suffix }}" == zip ]]; then
            (cd staging && zip -9 "../$archive" ./*)
          else
            tar -czf "$archive" -C staging .
          fi
          sha256sum "$archive" > "$archive.sha256"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "VelaRi $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" velari-* --clobber
